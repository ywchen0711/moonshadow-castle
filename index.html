<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0612">
<title>月影城 Moonshadow Castle</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="title" class="screen">
    <div class="moon"></div>
    <div class="logo"><div class="l1" data-t="title"></div><div class="l2" data-t="subtitle"></div></div>
    <div class="tmenu">
      <button id="bCont" data-t="cont"></button>
      <button id="bNew" data-t="newGame"></button>
      <button id="bHow" data-t="howTo"></button>
      <button id="bDex" data-t="dexT"></button>
      <div class="row"><button id="bZh" class="small">中文</button><button id="bEn" class="small">English</button></div>
    </div>
    <div class="ver">v2.0</div>
  </div>

  <div id="how" class="screen panel hidden">
    <h2 data-t="howTo"></h2>
    <p data-t="controlsKb"></p><p data-t="controlsPad"></p><p data-t="controlsTouch"></p><p data-t="controlsTips"></p>
    <button class="closeBtn" data-t="back"></button>
  </div>

  <div id="dex" class="screen panel hidden">
    <h2 data-t="dexT"></h2>
    <div class="tabs dtabs"></div>
    <div class="dbody"></div>
    <button class="closeBtn" data-t="back"></button>
  </div>

  <div id="confirm" class="screen panel hidden">
    <p data-t="overwrite"></p>
    <div class="row"><button id="bYes" data-t="yes"></button><button id="bNo" data-t="no"></button></div>
  </div>

  <div id="toasts"></div>
  <div id="areaName" class="hidden"></div>

  <div id="dialog" class="hidden"><div class="who"></div><div class="text"></div><div class="more">▼</div></div>

  <div id="menu" class="screen panel hidden">
    <div class="tabs"></div>
    <div class="body"></div>
    <button class="closeBtn" data-t="resume"></button>
  </div>

  <div id="shop" class="screen panel hidden">
    <h2 data-t="shopT"></h2>
    <div class="tabs"><button data-mode="buy" data-t="buy"></button><button data-mode="sell" data-t="sell"></button><button data-mode="gamble" data-t="gamble"></button><button data-mode="gems" data-t="gems"></button><span class="goldLbl"></span></div>
    <div class="body"></div>
    <div class="msg"></div>
    <button class="closeBtn" data-t="close"></button>
  </div>

  <div id="warp" class="screen panel hidden">
    <h2 data-t="warpT"></h2>
    <p class="sm" data-t="warpHelp"></p>
    <div class="body"></div>
    <button class="closeBtn" data-t="stay"></button>
  </div>

  <div id="over" class="screen hidden">
    <div class="big" data-t="gameOver"></div>
    <button id="bRetry" data-t="retry"></button>
    <button id="bTitle" data-t="toTitle"></button>
  </div>

  <div id="ending" class="screen hidden">
    <div class="big" data-t="theEnd"></div>
    <div class="stats"></div>
    <button id="bEndTitle" data-t="toTitle"></button>
  </div>

  <div id="touch" class="hidden">
    <div id="pad"><div class="knob"></div></div>
    <div id="btns">
      <button data-k="dash" class="tb s1"></button>
      <button data-k="bat" class="tb s2"></button>
      <button data-k="sub" class="tb s3"></button>
      <button data-k="mist" class="tb s4" style="display:none"></button>
      <button data-k="attack" class="tb big1"></button>
      <button data-k="jump" class="tb big2"></button>
    </div>
    <div id="topBtns"><button data-k="map" class="tt">🗺</button><button data-k="menu" class="tt">☰</button></div>
  </div>
</div>
<script type="module" src="js/main.js?v=7"></script>
<script src="/hub.js" data-pos="top-left"></script>
</body>
</html>
